[project]
name = "soul-platform"
version = "0.1.0"
description = "SOUL Platform — contained agent runtime, coordination and autonomy for SOUL Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "soul-framework>=0.3.0,<0.4",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "soul-framework[postgres]>=0.3.0,<0.4"]
embeddings = ["soul-framework[embeddings]>=0.3.0,<0.4"]
desktop = ["pywebview>=5"]
all = ["soul-platform[postgres,embeddings,desktop]"]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
soul-platform = "soul_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_platform"]

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/dist",
    "/backend",
    "/runtime",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
