[project]
name = "soul-platform"
version = "0.7.0.dev1"
description = "SOUL Platform — contained agent runtime, coordination and autonomy for SOUL Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "soul-framework==0.5.0.dev1",
    "numpy>=1.26",
    "usearch>=2.16.0",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["soul-framework[postgres]==0.5.0.dev1"]
embeddings = ["soul-framework[embeddings]==0.5.0.dev1"]
desktop = ["pystray==0.19.5", "pillow==12.3.0"]
all = ["soul-platform[postgres,embeddings,desktop]"]
dev = [
    "build==1.5.0",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "twine==7.0.0",
]

[project.scripts]
soul-platform = "soul_platform.cli:main"
soul-machine = "soul_platform.bootstrap:main"
soul-machine-embedding-cutover = "soul_platform.embedding_cutover:main"
soul-machine-doctor = "soul_platform.doctor:main"
soul-tray-cli = "soul_platform.tray:main"
soul-autowire = "soul_platform.autowire.cli:main"
soul-mcp-stdio = "soul_platform.mcp_stdio:main"
soul-codex-session-start = "soul_platform.codex_session_start:main"

[project.gui-scripts]
soul-tray = "soul_platform.tray:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_platform"]

[tool.hatch.build]
exclude = [
    "/.pytest_cache",
    "/dist",
    "/dist-*",
    "/uv.lock",
    "/backend",
    "/runtime",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
